[project]
name = "cert_tracker"
version = "0.1.0"
description = "cert_tracker using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.22,<2.0.0"
]

[project.scripts]
kickoff = "cert_tracker.main:kickoff"
run_crew = "cert_tracker.main:kickoff"
plot = "cert_tracker.main:plot"
run_with_trigger = "cert_tracker.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "5bf5e3b2-0e44-42c0-8752-789ae84d6baa"
